<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nosmero">
    <meta name="description" content="Nostr client with Monero tipping.">

    <title>Nosmero</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <link rel="stylesheet" href="/styles.css?v=20260523n">

    <!-- nostr-tools IIFE — provides window.NostrTools globally -->
    <script src="/lib/nostr-tools.bundle.js"></script>
    <!-- DOMPurify for content sanitize -->
    <script src="/lib/purify.min.js"></script>
    <!-- QR code generator (used on profile address) -->
    <script src="/lib/qrcode.min.js"></script>

</head>
<body class="tab-feed">

<!-- =================== LOGIN VIEW (overlay) =================== -->
<div id="loginView" class="overlay-view" hidden>
    <div class="login-container">
        <div class="login-logo">
            <img src="/assets/logo_nosmero.svg" alt="Nosmero" width="48" height="48">
            <h1>Nosmero</h1>
            <p class="login-tag">Nostr · Monero tips</p>
        </div>

        <!-- u/p form (default) -->
        <form id="loginFormUp" class="auth-form" autocomplete="on">
            <label class="field">
                <span>Username</span>
                <input type="text" id="loginUsername" autocomplete="username" required>
            </label>
            <label class="field">
                <span>Password</span>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
            </label>
            <label class="field">
                <span>Device PIN (4+ digits) — encrypts your key on this device</span>
                <input type="password" id="loginPin" autocomplete="off" inputmode="numeric" required>
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
            <button type="button" id="loginForgotBtn" class="btn-link">Forgot password?</button>
        </form>

        <div class="auth-divider"><span>or use</span></div>

        <div class="auth-alts">
            <button type="button" id="loginNsecBtn"  class="btn btn-secondary">🔑 nsec key</button>
            <button type="button" id="loginNip07Btn" class="btn btn-secondary">🧩 Browser extension</button>
            <button type="button" id="loginBunkerBtn" class="btn btn-secondary">🔐 NIP-46 bunker</button>
        </div>

        <div class="auth-footer">
            <button type="button" id="loginSignupBtn" class="btn-link">New here? Sign up</button>
        </div>
    </div>

    <!-- nsec entry sub-form (hidden initially) -->
    <div id="nsecForm" class="auth-subform" hidden>
        <button type="button" class="back-btn" data-action="auth-back">← Back</button>
        <h2>Sign in with nsec</h2>
        <label class="field">
            <span>Your nsec</span>
            <input type="password" id="nsecInput" placeholder="nsec1…" autocomplete="off">
        </label>
        <label class="field">
            <span>PIN (4+ digits) — encrypts your key on this device</span>
            <input type="password" id="nsecPin" autocomplete="off" inputmode="numeric">
        </label>
        <button type="button" id="nsecLoginSubmit" class="btn btn-primary">Continue</button>
    </div>

    <!-- bunker entry sub-form -->
    <div id="bunkerForm" class="auth-subform" hidden>
        <button type="button" class="back-btn" data-action="auth-back">← Back</button>
        <h2>Connect a NIP-46 bunker</h2>
        <label class="field">
            <span>bunker:// URI</span>
            <input type="text" id="bunkerInput" placeholder="bunker://…" autocomplete="off">
        </label>
        <button type="button" id="bunkerSubmit" class="btn btn-primary">Connect</button>
    </div>

    <!-- signup sub-form -->
    <form id="signupForm" class="auth-subform" autocomplete="on" hidden>
        <button type="button" class="back-btn" data-action="auth-back">← Back</button>
        <h2>Create Nosmero account</h2>
        <label class="field">
            <span>Username</span>
            <input type="text" id="signupUsername" autocomplete="username">
        </label>
        <label class="field">
            <span>Password</span>
            <input type="password" id="signupPassword" autocomplete="new-password">
        </label>
        <label class="field">
            <span>Device PIN (4+ digits)</span>
            <input type="password" id="signupPin" autocomplete="off" inputmode="numeric">
        </label>
        <label class="field opt-existing">
            <input type="checkbox" id="signupUseExistingNsec">
            <span>I have an existing nsec to use</span>
        </label>
        <label class="field" id="signupNsecRow" hidden>
            <span>Your nsec</span>
            <input type="password" id="signupNsec" placeholder="nsec1…" autocomplete="off">
        </label>
        <button type="submit" id="signupSubmit" class="btn btn-primary">Create account</button>
    </form>

    <!-- forgot password sub-form -->
    <form id="forgotForm" class="auth-subform" autocomplete="off" hidden>
        <button type="button" class="back-btn" data-action="auth-back">← Back</button>
        <h2>Reset password</h2>
        <p class="muted">Paste your nsec to prove ownership, then set a new password.</p>
        <label class="field">
            <span>Username</span>
            <input type="text" id="forgotUsername" autocomplete="username">
        </label>
        <label class="field">
            <span>Your nsec</span>
            <input type="password" id="forgotNsec" placeholder="nsec1…" autocomplete="off">
        </label>
        <label class="field">
            <span>New password</span>
            <input type="password" id="forgotNewPassword" autocomplete="new-password">
        </label>
        <label class="field">
            <span>Device PIN (4+ digits)</span>
            <input type="password" id="forgotPin" autocomplete="off" inputmode="numeric">
        </label>
        <button type="submit" id="forgotSubmit" class="btn btn-primary">Reset password</button>
    </form>
</div>


<!-- =================== APP CHROME =================== -->
<header id="appHeader" class="app-header">
    <!-- Header content is set per-tab by js/app.js -->
    <div id="headerContent" class="header-content"></div>
</header>


<!-- =================== TAB VIEWS =================== -->
<main id="appMain" class="app-main">

    <!-- Feed -->
    <section id="feedView" class="view view-feed">
        <div class="feed-picker-bar">
            <button type="button" id="feedPickerBtn" class="feed-picker-btn">
                <span id="feedPickerLabel">Following</span>
                <span class="chev">▾</span>
            </button>
        </div>

        <div id="feedList" class="feed-list" data-empty-msg="No posts yet."></div>

        <div id="feedLoadMore" class="load-more-row" hidden>
            <button type="button" class="btn btn-secondary" id="feedLoadMoreBtn">Load more</button>
        </div>
    </section>

    <!-- Compose -->
    <section id="composeView" class="view view-compose">
        <div id="composeReplyChip" class="compose-reply-chip" hidden></div>
        <textarea id="composeBody" class="compose-body" placeholder="What's on your mind?" rows="6"></textarea>
        <div id="composeMedia" class="compose-media"></div>
        <div class="compose-toolbar">
            <button type="button" id="composeImgBtn"  class="tool-btn">📷 Image</button>
            <button type="button" id="composeIpfsBtn" class="tool-btn">📦 IPFS</button>
            <span class="compose-spacer"></span>
            <span id="composeChars" class="char-count"></span>
        </div>
        <input type="file" id="composeFileInput" accept="image/*,video/*" hidden>
        <input type="file" id="composeIpfsInput" accept="image/*,video/*,application/pdf" hidden>
    </section>

    <!-- Notifications -->
    <section id="notifView" class="view view-notif">
        <div id="notifList" class="notif-list" data-empty-msg="No notifications yet."></div>
    </section>

    <!-- Profile -->
    <section id="profileView" class="view view-profile">
        <div id="profileContent"></div>
    </section>
</main>


<!-- ============ FULL-SCREEN OVERLAYS (BODY-LEVEL) ============
     Live OUTSIDE #appMain so iOS Safari's overflow:hidden parent
     can't clip these position:fixed sections. -->

<section id="threadView" class="overlay-view" hidden>
    <div class="overlay-header">
        <button type="button" class="back-btn" data-action="close-overlay" data-target="threadView">← Back</button>
        <h2>Thread</h2>
    </div>
    <div id="threadContent" class="thread-content"></div>
</section>

<section id="searchView" class="overlay-view" hidden>
    <div class="overlay-header">
        <button type="button" class="back-btn" data-action="close-overlay" data-target="searchView">← Back</button>
        <input type="search" id="searchInput" placeholder="Search Nostr…" autocomplete="off">
    </div>
    <div id="searchResults" class="search-results" data-empty-msg="Enter a query to search."></div>
</section>

<section id="userProfileView" class="overlay-view" hidden>
    <div class="overlay-header">
        <button type="button" class="back-btn" data-action="close-overlay" data-target="userProfileView">← Back</button>
        <h2 id="userProfileTitle">Profile</h2>
    </div>
    <div id="userProfileContent"></div>
</section>

<section id="settingsView" class="overlay-view" hidden>
    <div class="overlay-header">
        <button type="button" class="back-btn" data-action="close-overlay" data-target="settingsView">← Back</button>
        <h2>Settings</h2>
    </div>
    <div id="settingsContent"></div>
</section>


<!-- =================== BOTTOM TAB BAR =================== -->
<nav id="tabBar" class="tab-bar">
    <button type="button" class="tab-btn" data-tab="feed">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Feed</span>
    </button>
    <button type="button" class="tab-btn" data-tab="compose" aria-label="New post">
        <span class="tab-icon">✏️</span>
        <span class="tab-label">Post</span>
    </button>
    <button type="button" class="tab-btn" data-tab="notif">
        <span class="tab-icon">🔔</span>
        <span class="notif-badge" id="notifBadge" hidden></span>
        <span class="tab-label">Alerts</span>
    </button>
    <button type="button" class="tab-btn" data-tab="profile">
        <span class="tab-icon">👤</span>
        <span class="tab-label">Profile</span>
    </button>
</nav>


<!-- =================== TOASTS =================== -->
<div id="toasts" class="toasts"></div>


<!-- =================== MODALS =================== -->
<dialog id="feedPickerModal" class="modal feed-picker-modal">
    <h3>Choose feed</h3>
    <button type="button" class="feed-pick-row" data-feed="following">
        <span>Following</span>
        <span class="muted">People you follow</span>
    </button>
    <button type="button" class="feed-pick-row" data-feed="popular">
        <span>Popular</span>
        <span class="muted">Most engagement now</span>
    </button>
    <button type="button" class="feed-pick-row" data-feed="trending-monero">
        <span>Trending Monero</span>
        <span class="muted">#monero notes</span>
    </button>
    <button type="button" class="modal-close" data-action="close-modal">Cancel</button>
</dialog>

<dialog id="repostMenuModal" class="modal post-actions-modal">
    <button type="button" class="action-row" data-action="repost-plain">🔁 Repost</button>
    <button type="button" class="action-row" data-action="repost-quote">💬 Quote post (add your comment)</button>
    <button type="button" class="modal-close" data-action="close-modal">Cancel</button>
</dialog>

<dialog id="postActionsModal" class="modal post-actions-modal">
    <button type="button" class="action-row" data-action="post-mute">🔇 Mute author</button>
    <button type="button" class="action-row" data-action="post-copy-nevent">📋 Copy note link</button>
    <button type="button" class="action-row" data-action="post-open-ext">↗️ Open in external client</button>
    <button type="button" class="modal-close" data-action="close-modal">Cancel</button>
</dialog>


<!-- =================== APP ENTRY =================== -->
<script type="module" src="/js/app.js"></script>

</body>
</html>
